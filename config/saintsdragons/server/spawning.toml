
[spawning]
	#Entity spawn configuration - control how often Saint's Dragons creatures spawn
	#Note: spawn weights are relative per biome/category roll.
	#Final spawn frequency also depends on each entity's spawn predicate and placement checks.
	#Natural wild dragon spawns are also filtered by shared density rules to stop creature-category dragons from piling up.
	#With custom spawning enabled, Raevyx spawns are driven by thunderstorms.
	#Disabling custom spawning restores vanilla biome spawning for Raevyx.
	#Each species has an automatic spawning toggle. Disabling it does not remove existing entities or block spawn eggs, commands, or breeding.
	#Disabling Ignivorus, Varasuchus, or Ivy also stops their structures in newly generated chunks. Existing structures are not modified.
	#Restart the client for singleplayer, or the server for multiplayer, after changing a spawning toggle.
	#Raevyx spawn settings
	raevyxSpawningEnabled = true
	raevyxCustomSpawningEnabled = true
	#Range: 0 ~ 5000
	raevyxSpawnWeight = 5000
	#Range: 1 ~ 10
	raevyxMinGroupSize = 2
	#Range: 1 ~ 10
	raevyxMaxGroupSize = 4
	#Stegonaut spawn settings
	stegonautSpawningEnabled = true
	stegonautCustomSpawningEnabled = true
	#Range: 0 ~ 5000
	stegonautSpawnWeight = 5000
	#Range: 1 ~ 10
	stegonautMinGroupSize = 2
	#Range: 1 ~ 10
	stegonautMaxGroupSize = 4
	#Cindervane spawn settings
	cindervaneSpawningEnabled = true
	#Range: 0 ~ 5000
	cindervaneSpawnWeight = 5000
	#Range: 1 ~ 10
	cindervaneMinGroupSize = 2
	#Range: 1 ~ 10
	cindervaneMaxGroupSize = 4
	#Ignivorus structure spawn settings
	ignivorusSpawningEnabled = true
	#Varasuchus structure spawn settings
	varasuchusSpawningEnabled = true
	#Atroxiia spawn settings
	atroxiiaSpawningEnabled = true
	#Range: 0 ~ 5000
	atroxiiaSpawnWeight = 5000
	#Range: 1 ~ 10
	atroxiiaMinGroupSize = 2
	#Range: 1 ~ 10
	atroxiiaMaxGroupSize = 4
	#Volitans spawn settings (custom underwater spawner for ocean/wetland habitats)
	volitansSpawningEnabled = true
	volitansCustomSpawningEnabled = true
	#Range: 0 ~ 5000
	volitansSpawnWeight = 5000
	#Range: 1 ~ 10
	volitansMinGroupSize = 2
	#Range: 1 ~ 10
	volitansMaxGroupSize = 4
	#Nulljaw spawn settings (End-floating dragon)
	nulljawSpawningEnabled = true
	#Range: 0 ~ 5000
	nulljawSpawnWeight = 5000
	#Range: 1 ~ 10
	nulljawMinGroupSize = 2
	#Range: 1 ~ 10
	nulljawMaxGroupSize = 4
	#Moop spawn settings
	moopSpawningEnabled = true
	#Range: 0 ~ 5000
	moopSpawnWeight = 5000
	#Range: 1 ~ 10
	moopMinGroupSize = 2
	#Range: 1 ~ 10
	moopMaxGroupSize = 4
	#Mossback spawn settings
	mossbackSpawningEnabled = true
	#Range: 0 ~ 5000
	mossbackSpawnWeight = 5000
	#Range: 1 ~ 10
	mossbackMinGroupSize = 2
	#Range: 1 ~ 10
	mossbackMaxGroupSize = 4
	#Ivy structure spawn settings
	ivySpawningEnabled = true

